apply plugin: 'com.android.application'

// Release signing: read from a properties file kept OUTSIDE the repo (default
// ~/.baaki-signing/signing.properties, or the path in BAAKI_SIGNING) with
// storeFile, storePassword, keyAlias and keyPassword. Without it the release
// build is simply left unsigned, so CI and other machines still build.
def signingProps = new Properties()
def signingFile = file(System.getenv("BAAKI_SIGNING") ?: "${System.getProperty('user.home')}/.baaki-signing/signing.properties")
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

// The version lives in one place: "version" in the repo's package.json. The
// version code is derived from it (major*10000 + minor*100 + patch, so 1.1.0 is
// 10100), which always rises with the version. BAAKI_VERSION_NAME and
// BAAKI_VERSION_CODE can still override both for a one-off build.
def packageVersion = new groovy.json.JsonSlurper().parse(file("${rootDir}/../package.json")).version as String
def versionParts = packageVersion.tokenize('.').collect { it.replaceAll(/\D.*/, "") as Integer }
def baakiVersionName = System.getenv("BAAKI_VERSION_NAME") ?: packageVersion
def baakiVersionCode = Integer.parseInt(System.getenv("BAAKI_VERSION_CODE") ?:
        String.valueOf(versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]))

android {
    namespace = "app.baaki"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.baaki"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump "version" in package.json for each release; Android only installs
        // an APK over another if its versionCode is higher.
        versionCode baakiVersionCode
        versionName baakiVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingProps.containsKey("storeFile")) {
                storeFile file(signingProps["storeFile"])
                storePassword signingProps["storePassword"]
                keyAlias signingProps["keyAlias"]
                keyPassword signingProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            if (signingProps.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
            // R8 drops unused Java code and resources. Capacitor and its plugins
            // ship their own keep rules for the classes the bridge finds by name.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
